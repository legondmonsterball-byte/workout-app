<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<title>운동 기록</title>
<style>
:root{
  --bg:#0b0b0e;--card:#17171c;--text:#fff;--sub:#9aa0aa;--line:#25252c;
  --acc:#c6ff3d;--acc-t:rgba(198,255,61,.14);--acc-b:rgba(198,255,61,.3);
  --red:#ff6b78;--red-t:rgba(255,107,120,.14);--gray-t:rgba(154,160,170,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
body{overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;margin:8px 4px 4px;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px;margin:0 4px 18px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}
.big{font-size:22px;font-weight:800;letter-spacing:-.4px}
.mid{font-size:18px;font-weight:700;user-select:none;-webkit-user-select:none}
.small{font-size:13px;color:var(--sub)}
.lab{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:1px}
.chip{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gray-t);color:var(--sub)}
.chip.on{background:var(--acc-t);color:var(--acc)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;text-align:center;
  background:var(--acc-t);color:var(--acc);border:1px solid var(--acc-b);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--gray-t);color:var(--text);border-color:transparent}
.btn.red{background:var(--red-t);color:var(--red);border-color:transparent}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tgt{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:14px 0 4px;
  background:linear-gradient(135deg,#c6ff3d,#3dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.set{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.set .n{width:42px;color:var(--sub);font-size:14px}
.set .v{flex:1;font-weight:600}
.x{color:var(--sub);font-size:18px;padding:2px 8px}
.inputs{display:flex;gap:8px;margin:12px 0}
.inputs label{flex:1;font-size:12px;color:var(--sub)}
.inputs input,input.txt{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:0;background:var(--gray-t);
  font:inherit;font-size:18px;font-weight:700;color:var(--text);text-align:center;outline:none}
input.txt{text-align:left;font-size:16px;font-weight:500}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.96);opacity:.5}100%{transform:none;opacity:1}}
.fx-off .pop,.fx-off .intro{animation:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  background:rgba(11,11,14,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);z-index:5}
.tabbar>div{display:flex;width:100%;max-width:520px}
.tab{flex:1;padding:11px 0 10px;text-align:center;font-size:11px;color:var(--sub);font-weight:600}
.tab i{display:block;font-style:normal;font-size:21px;margin-bottom:2px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--acc)}.tab.on i{filter:none;opacity:1}
.rest{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:6;
  background:#26262e;border:1px solid #34343e;border-radius:18px;padding:12px 14px;overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width .25s linear}
.rest .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:76px}
.rest button{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.rest.end{background:var(--acc);color:#0b0b0e;border-color:var(--acc)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:520px;max-height:82%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.fx-off .sheet{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pick{display:flex;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--line);font-weight:600;width:100%;text-align:left}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:12px}
.bars div{flex:1;background:var(--acc-t);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.bars div.last{background:var(--acc)}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--gray-t);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--acc)}.toggle.on::after{transform:translateX(20px);background:#0b0b0e}
.intro{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;animation:introout .9s ease forwards}
.intro .logo{font-size:56px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.intro b{font-size:20px;font-weight:800}
@keyframes introout{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
.empty{text-align:center;color:var(--sub);padding:40px 0;line-height:1.7}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;transition:border-color .15s}
.opt b{display:block;font-size:17px;margin-bottom:3px}
.opt span{color:var(--sub);font-size:13px}
.opt.on{border-color:var(--acc);background:var(--acc-t)}
.opt.on b{color:var(--acc)}
.dots{display:flex;gap:6px;margin:6px 4px 18px}.dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}.dots i.on{background:var(--acc)}
.two{display:flex;gap:10px}.two label{flex:1;font-size:12px;color:var(--sub)}
.two input{width:100%;margin-top:4px;padding:14px;border-radius:12px;border:0;background:var(--gray-t);font:inherit;font-size:18px;font-weight:700;color:var(--text);outline:none}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food{position:relative;background:var(--gray-t);border-radius:14px;padding:12px;text-align:left;transition:transform .12s;user-select:none;-webkit-user-select:none}
.food:active{transform:scale(.96)}.food b{display:block;font-size:15px}.food span{font-size:12px;color:var(--sub)}
.food .x{position:absolute;top:4px;right:2px;color:var(--red)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ───────── 데이터 ─────────
const GROUPS=['가슴','등','어깨','하체','팔','코어'];
const EX=[
  {n:'벤치프레스',g:'가슴'},{n:'인클라인 덤벨프레스',g:'가슴'},{n:'푸시업',g:'가슴'},{n:'케이블 플라이',g:'가슴'},
  {n:'덤벨 숄더프레스',g:'어깨'},{n:'사이드 레터럴 레이즈',g:'어깨'},{n:'페이스풀',g:'어깨'},
  {n:'트라이셉스 푸시다운',g:'팔'},{n:'덤벨 컬',g:'팔'},{n:'해머 컬',g:'팔'},
  {n:'데드리프트',g:'등'},{n:'랫풀다운',g:'등'},{n:'바벨 로우',g:'등'},{n:'시티드 로우',g:'등'},{n:'풀업',g:'등'},
  {n:'스쿼트',g:'하체'},{n:'레그프레스',g:'하체'},{n:'루마니안 데드리프트',g:'하체'},{n:'레그 컬',g:'하체'},{n:'런지',g:'하체'},{n:'카프 레이즈',g:'하체'},
  {n:'플랭크',g:'코어',time:1},{n:'크런치',g:'코어'},{n:'레그 레이즈',g:'코어'}
];
const SPLITS={
  '3':{n:'3분할',d:'밀기 · 당기기 · 하체',days:[
    {k:'밀기',desc:'가슴 · 어깨 · 삼두',g:['가슴','어깨'],list:['벤치프레스','인클라인 덤벨프레스','덤벨 숄더프레스','사이드 레터럴 레이즈','트라이셉스 푸시다운']},
    {k:'당기기',desc:'등 · 이두',g:['등','팔'],list:['데드리프트','랫풀다운','시티드 로우','페이스풀','덤벨 컬']},
    {k:'하체',desc:'하체 · 코어',g:['하체','코어'],list:['스쿼트','레그프레스','루마니안 데드리프트','레그 컬','플랭크']}]},
  '2':{n:'2분할',d:'상체 · 하체',days:[
    {k:'상체',desc:'가슴 · 등 · 어깨 · 팔',g:['가슴','등','어깨','팔'],list:['벤치프레스','랫풀다운','덤벨 숄더프레스','시티드 로우','덤벨 컬','트라이셉스 푸시다운']},
    {k:'하체',desc:'하체 · 코어',g:['하체','코어'],list:['스쿼트','레그프레스','루마니안 데드리프트','레그 컬','카프 레이즈','플랭크']}]},
  '4':{n:'4분할',d:'가슴 · 등 · 어깨/팔 · 하체',days:[
    {k:'가슴',desc:'가슴 · 삼두',g:['가슴'],list:['벤치프레스','인클라인 덤벨프레스','케이블 플라이','푸시업','트라이셉스 푸시다운']},
    {k:'등',desc:'등 · 이두',g:['등'],list:['데드리프트','랫풀다운','바벨 로우','시티드 로우','풀업']},
    {k:'어깨·팔',desc:'어깨 · 팔',g:['어깨','팔'],list:['덤벨 숄더프레스','사이드 레터럴 레이즈','페이스풀','덤벨 컬','해머 컬','트라이셉스 푸시다운']},
    {k:'하체',desc:'하체 · 코어',g:['하체','코어'],list:['스쿼트','레그프레스','루마니안 데드리프트','레그 컬','플랭크']}]},
  '5':{n:'5분할',d:'가슴 · 등 · 하체 · 어깨 · 팔',days:[
    {k:'가슴',desc:'가슴',g:['가슴'],list:['벤치프레스','인클라인 덤벨프레스','케이블 플라이','푸시업']},
    {k:'등',desc:'등',g:['등'],list:['데드리프트','랫풀다운','바벨 로우','시티드 로우','풀업']},
    {k:'하체',desc:'하체 · 코어',g:['하체','코어'],list:['스쿼트','레그프레스','루마니안 데드리프트','레그 컬','플랭크']},
    {k:'어깨',desc:'어깨',g:['어깨'],list:['덤벨 숄더프레스','사이드 레터럴 레이즈','페이스풀']},
    {k:'팔',desc:'이두 · 삼두',g:['팔'],list:['덤벨 컬','해머 컬','트라이셉스 푸시다운']}]},
  'F':{n:'전신',d:'매번 전신을 한 번에',days:[
    {k:'전신',desc:'전신',g:['가슴','등','어깨','하체','팔','코어'],list:['스쿼트','벤치프레스','바벨 로우','덤벨 숄더프레스','플랭크']}]}
};
const GOALS={
  cut:{n:'체중 감량',d:'지방은 줄이고 근육은 지켜요',lo:12,hi:15,sets:3,rest:60,prog:1,kcal:-500,pr:2.0},
  muscle:{n:'근육량 증가',d:'꾸준히 근육을 키워요',lo:8,hi:12,sets:3,rest:90,prog:1,kcal:250,pr:1.8},
  maintain:{n:'유지',d:'지금 몸을 안정적으로 지켜요',lo:8,hi:12,sets:3,rest:90,prog:0,kcal:0,pr:1.6},
  lean:{n:'린매스업',d:'체지방은 적게, 근육은 천천히 늘려요',lo:8,hi:12,sets:4,rest:90,prog:1,kcal:150,pr:1.8},
  bulk:{n:'벌크업',d:'무게를 빠르게 올려 크게 키워요',lo:6,hi:10,sets:4,rest:120,prog:1,kcal:450,pr:1.8}
};
const AI_URL='https://workout-ai.timetable-app.workers.dev'; // 운동 앱 Gemini Worker 주소 (배포 후 채움). 비어 있으면 AI 버튼이 안 보인다
const KEY='workout-v1';
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}
  return{sessions:[],active:null,custom:[],set:{fx:!matchMedia('(prefers-reduced-motion:reduce)').matches,rest:90}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const allEx=()=>EX.concat(S.custom);
const exInfo=n=>allEx().find(e=>e.n===n)||{n,g:'기타'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const goal=()=>GOALS[S.profile?.goal]||GOALS.muscle;
const split=()=>SPLITS[S.profile?.split]||SPLITS['3'];

// ───────── 계산 ─────────
const vol=sets=>sets.reduce((a,s)=>a+(s.w||0)*(s.r||0),0);
const sessVol=s=>s.entries.reduce((a,e)=>a+vol(e.sets),0);
const sessSets=s=>s.entries.reduce((a,e)=>a+e.sets.length,0);
const fmtT=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};
const fmtV=v=>v>=10000?(v/1000).toFixed(1)+'t':v.toLocaleString()+'kg';
const dayDiff=ts=>Math.floor((Date.now()-ts)/864e5);
const fmtD=ts=>{const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`};
const setTxt=s=>s.t?s.t+'초':s.w?`${s.w}kg × ${s.r}회`:`맨몸 × ${s.r}회`;
function lastTop(name){
  for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].entries.find(x=>x.ex===name);
    if(e&&e.sets.length){return e.sets.reduce((a,b)=>(b.w||0)>=(a.w||0)?b:a)}}
  return null}
// 점진적 과부하: 지난 최고 세트 → 오늘 목표
function suggest(name){
  const g=goal(),t=lastTop(name),info=exInfo(name);
  if(!t)return info.time?{t:30,note:'처음이에요 · 편한 시간으로 시작해요'}:{w:0,r:g.lo,note:'처음이에요 · 편한 무게로 시작해요'};
  const prev='지난번 '+setTxt(t);
  if(info.time)return{t:(t.t||30)+(g.prog?5:0),note:prev+(g.prog?' → +5초':' → 유지')};
  if(!g.prog)return{w:t.w||0,r:t.r,note:prev+' → 유지'};
  if(!t.w)return{w:0,r:t.r+1,note:prev+' → 1회 더'};
  if(t.r>=g.hi){const inc=info.g==='하체'?5:2.5;return{w:t.w+inc,r:g.lo,note:prev+` → 무게 +${inc}kg`}}
  return{w:t.w,r:t.r+1,note:prev+' → 1회 더'}}
function recommend(){
  const info=split().days.map(sp=>{let last=-1;
    for(const s of S.sessions){if(s.entries.some(e=>sp.g.includes(exInfo(e.ex).g)))last=Math.max(last,s.start)}
    return{sp,last}});
  info.sort((a,b)=>a.last-b.last);return info[0]}

const dayKey=(ts=Date.now())=>{const d=new Date(ts);return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
// 하루 목표: 인바디 기초대사량이 있으면 그 값, 없으면 나이·성별로 추정(Mifflin-St Jeor)
function target(){const p=S.profile;if(!p||!p.w)return null;
  let bmr=p.bmr;if(!bmr){if(!p.age||!p.sex||!p.h)return null;bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161)}
  const g=GOALS[p.goal]||GOALS.muscle,f=(p.days||4)>=6?1.725:(p.days||4)>=4?1.55:1.375;
  const kcal=Math.round((bmr*f+g.kcal)/10)*10,prot=Math.round(p.w*g.pr),fat=Math.round(p.w*(p.goal==='cut'?0.8:0.9));
  return{bmr:Math.round(bmr),kcal,prot,fat,carb:Math.max(0,Math.round((kcal-prot*4-fat*9)/4))}}
const todayMeals=()=>(S.meals||[]).filter(m=>m.d===dayKey());

    <div class="row between"><div class="big">${sheet.replace!=null||sheet.rt>=0?'다른 운동으로 바꾸기':'운동 고르기'}</div><button class="x" data-a="close">닫기</button></div>
    <input class="txt" id="sq" placeholder="검색 또는 새 운동 이름" value="${esc(sheet.q)}" style="margin-top:12px">
    <div class="chips">${['전체',...GROUPS].map(g=>`<button class="chip ${sheet.g===g?'on':''}" data-a="chipg" data-p="${g}">${g}</button>`).join('')}</div>
    <div id="plist">${pickList()}</div><button class="btn gray" style="margin-top:12px" data-a="newex">＋ 입력한 이름으로 추가</button></div></div>`;
  let fs='';
  if(fsheet!=null&&foods()[fsheet]){const f=foods()[fsheet];fs=`<div class="sheet-bg" data-a="fclose"><div class="sheet">
    <div class="big" style="margin-bottom:12px">식단템 수정</div>
    <input class="txt" id="e-n" value="${esc(f.n)}" placeholder="이름 (양도 적어요. 예: 닭가슴살 100g)">
    <div class="inputs"><label>칼로리(kcal)<input id="e-k" type="number" inputmode="numeric" value="${f.k}"></label><label>단백질(g)<input id="e-p" type="number" inputmode="numeric" value="${f.p}"></label></div>
    <button class="btn" data-a="fsave">저장</button>
    <div class="row" style="margin-top:10px"><button class="btn red sm grow" data-a="fdel">삭제</button><button class="btn gray sm grow" data-a="fclose">취소</button></div></div></div>`}
  const tabs=[['today','🏋️','오늘'],['diet','🍽️','식단'],['log','📊','기록'],['set','⚙️','설정']];
  $('#app').innerHTML=`<div class="${tab==='today'?'':'pop'}">${main}</div>`;
  host.innerHTML=r+sh+fs+`<div class="tabbar"><div>${tabs.map(t=>`<button class="tab ${tab===t[0]?'on':''}" data-a="tab" data-p="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</div></div>`;
}
render();
// 인트로: 1초 안팎, 탭하면 건너뜀
if(S.set.fx){const i=document.createElement('div');i.className='intro';i.innerHTML='<div class="logo">🏋️</div><b>오늘도 한 세트</b>';
  i.onclick=()=>i.remove();document.body.appendChild(i);setTimeout(()=>i.remove(),950)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
